<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<title>ダッシュボード</title>
<style>
:root{color-scheme:light dark;--plane:#f6f6f3;--surface:#fdfdfc;--ink:#0b0b0b;--ink2:#52514e;--ring:rgba(11,11,11,.12);--acc:#2a78d6;--bad:#d03b3b}
@media (prefers-color-scheme:dark){:root{--plane:#0d0d0d;--surface:#181817;--ink:#f0efec;--ink2:#c3c2b7;--ring:rgba(255,255,255,.12);--acc:#4a95f0}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--plane);color:var(--ink);font:15px/1.6 system-ui,-apple-system,"Segoe UI","Yu Gothic UI","Hiragino Sans",sans-serif;padding:16px}
form[hidden]{display:none}
form{width:min(360px,100%);background:var(--surface);border:1px solid var(--ring);border-radius:14px;padding:22px;display:grid;gap:12px}
h1{font-size:18px;margin:0} input[type=password]{font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--ring);border-radius:10px;background:var(--plane);color:var(--ink);width:100%}
label{font-size:13.5px;color:var(--ink2);display:flex;gap:8px;align-items:center}
button{font:inherit;font-weight:600;padding:10px;border:0;border-radius:10px;background:var(--acc);color:#fff;cursor:pointer}
button[disabled]{opacity:.6} #msg{margin:0;font-size:13px;color:var(--bad);min-height:1.2em}
</style></head><body>
<form id="f" hidden><h1>ダッシュボード</h1>

<label><input type="checkbox" id="rm" checked>この端末で覚える</label>
<button id="go">開く</button><p id="msg" role="status"></p></form>

async function open(raw){const key=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
